[project]
name = "kaopu-workspace"
version = "0.1.0.dev0"
description = "Kaopu 开发工作区（不发布）"
requires-python = ">=3.11"
dependencies = ["kaopu-llm", "kaopu-agent"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kaopu-llm = { workspace = true }
kaopu-agent = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "pyright[nodejs]>=1.1.390",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["packages/llm/src", "packages/agent/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = [
  "E501",   # 行宽交给 ruff format；中文注释按显示宽度计算容易误报
  "ASYNC109", # run_subagent 等接口有意提供 timeout 参数（内部用 call_later 取消令牌实现）
  "RUF001", # 中文全角标点
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "PT012"]
"tests/**" = ["B011", "PT012"]

[tool.ruff.lint.isort]
known-first-party = ["kaopu_llm", "kaopu_agent"]

# ---------- pyright ----------
[tool.pyright]
include = ["packages/llm/src", "packages/agent/src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["packages/llm/tests", "packages/agent/tests", "tests"]
addopts = ["--import-mode=importlib", "-m", "not live", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: 需要真实 API Key 或本地模型服务的在线测试（默认跳过，用 -m live 运行）"]

# ---------- coverage ----------
[tool.coverage.run]
source = ["kaopu_llm", "kaopu_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.$",
]
