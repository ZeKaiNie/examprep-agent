[project]
name = "examprep"
version = "0.1.0.dev0"
description = "ExamPrep Agent L3：学习领域应用（资料引擎、知识库、学习者模型、教学 Agent、服务与 CLI）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ZeKaiNie" }]
dependencies = [
  "examprep-llm",
  "examprep-runtime",
  "pydantic>=2.7",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "pypdfium2>=4.30",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.scripts]
examprep = "examprep.cli:main"

[project.urls]
Homepage = "https://github.com/ZeKaiNie/examprep-agent"
Issues = "https://github.com/ZeKaiNie/examprep-agent/issues"

[tool.uv.sources]
examprep-llm = { workspace = true }
examprep-runtime = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examprep"]
